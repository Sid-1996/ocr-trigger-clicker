[project]
name = "ocr-trigger-clicker"
version = "0.3.0"
description = "Windows OCR and template-triggered automation tool."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-or-later"
dependencies = [
    "opencv-python>=4.10",
    "mss>=10.0",
    "numpy>=1.26",
    "pygetwindow>=0.0.9",
    "rapidocr-onnxruntime>=1.4",
    "PyQt6>=6.6",
    "pynput>=1.7",
    "dxcam>=0.3",
    "pywin32>=306",
    "frida>=16",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.15",
    "pyinstaller>=6.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["dist", "build", "__pycache__", "*.spec"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov --cov-report=term-missing"

